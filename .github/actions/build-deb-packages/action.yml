name: 'Build DEB Packages'
description: 'Build Debian/Ubuntu packages with shared runtime'
inputs:
  version:
    description: 'Package version'
    required: true
  dotnet-version:
    description: '.NET version to use'
    required: false
    default: '10.0.x'
  app-repo-token:
    description: 'Token for accessing the private NoMercyApp repo'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Build shared runtime payload
      uses: ./.github/actions/build-linux-installer-payload
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
        app-repo-token: ${{ inputs.app-repo-token }}

    - name: Repair runner apt state
      uses: ./.github/actions/repair-runner-apt-state

    - name: Install DEB build dependencies
      shell: bash
      run: |
        # dpkg-scanpackages is the only tool here that is not already on a Debian
        # box; dpkg-deb ships with dpkg itself. devscripts, fakeroot and
        # build-essential were never invoked by this action, and devscripts was
        # what dragged in the chain the repair step above has to clear.
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends dpkg-dev

    - name: Build DEB packages
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        PAYLOAD_PATH="./installer-payload"
        INSTALL_DIR="/opt/nomercy"

        # --- Main package: nomercy (shared runtime + all executables) ---
        PACKAGE_ROOT="./packages/debian-nomercy"
        rm -rf "${PACKAGE_ROOT}"

        mkdir -p "${PACKAGE_ROOT}/DEBIAN"
        mkdir -p "${PACKAGE_ROOT}${INSTALL_DIR}"
        mkdir -p "${PACKAGE_ROOT}/usr/bin"
        mkdir -p "${PACKAGE_ROOT}/usr/share/applications"
        mkdir -p "${PACKAGE_ROOT}/usr/share/icons/hicolor/scalable/apps"
        mkdir -p "${PACKAGE_ROOT}/usr/lib/systemd/user"
        mkdir -p "${PACKAGE_ROOT}/usr/share/doc/nomercy"

        # Copy entire shared runtime payload
        cp -R "${PAYLOAD_PATH}/"* "${PACKAGE_ROOT}${INSTALL_DIR}/"
        chmod 755 "${PACKAGE_ROOT}${INSTALL_DIR}/NoMercyMediaServer"
        chmod 755 "${PACKAGE_ROOT}${INSTALL_DIR}/NoMercyApp"
        chmod 755 "${PACKAGE_ROOT}${INSTALL_DIR}/NoMercyLauncher"
        chmod 755 "${PACKAGE_ROOT}${INSTALL_DIR}/nomercy"

        # Create symlinks in /usr/bin
        ln -s "${INSTALL_DIR}/NoMercyMediaServer" "${PACKAGE_ROOT}/usr/bin/nomercymediaserver"
        ln -s "${INSTALL_DIR}/NoMercyApp" "${PACKAGE_ROOT}/usr/bin/nomercyapp"
        ln -s "${INSTALL_DIR}/NoMercyLauncher" "${PACKAGE_ROOT}/usr/bin/nomercylauncher"
        ln -s "${INSTALL_DIR}/nomercy" "${PACKAGE_ROOT}/usr/bin/nomercy"

        # Copy desktop files
        for df in NoMercy-MediaServer.desktop NoMercy-MediaServer-Service.desktop NoMercy-App.desktop; do
          if [ -f "./assets/linux/${df}" ]; then
            install -Dm644 "./assets/linux/${df}" "${PACKAGE_ROOT}/usr/share/applications/"
          fi
        done

        # Copy icon
        install -Dm644 "./assets/icons/icon.png" \
          "${PACKAGE_ROOT}/usr/share/icons/hicolor/scalable/apps/NoMercy-MediaServer.png"

        # Systemd service files, control scripts and the copyright notice are
        # generated from the real checked-in templates/ (string-replaced for
        # {{VERSION}}/{{YEAR}}) — same pattern as build-arch-packages and
        # generate-repository-website. This also fixes a latent bug where the
        # inline heredocs (indented inside this YAML step) emitted a
        # DEBIAN/control with leading whitespace on every field line, which
        # dpkg parses as bogus header continuations.
        ACTION_TEMPLATES="${{ github.action_path }}/templates"

        cp "${ACTION_TEMPLATES}/usr/lib/systemd/user/nomercymediaserver.service" \
          "${PACKAGE_ROOT}/usr/lib/systemd/user/nomercymediaserver.service"
        chmod 644 "${PACKAGE_ROOT}/usr/lib/systemd/user/nomercymediaserver.service"

        cp "${ACTION_TEMPLATES}/usr/lib/systemd/user/nomercylauncher.service" \
          "${PACKAGE_ROOT}/usr/lib/systemd/user/nomercylauncher.service"
        chmod 644 "${PACKAGE_ROOT}/usr/lib/systemd/user/nomercylauncher.service"

        # Copyright file
        sed "s/{{YEAR}}/$(date +%Y)/g" \
          "${ACTION_TEMPLATES}/usr/share/doc/nomercy/copyright" \
          > "${PACKAGE_ROOT}/usr/share/doc/nomercy/copyright"

        # Control file
        sed "s/{{VERSION}}/${VERSION}/g" \
          "${ACTION_TEMPLATES}/DEBIAN/control" \
          > "${PACKAGE_ROOT}/DEBIAN/control"

        echo "Staged DEBIAN/control:"
        cat "${PACKAGE_ROOT}/DEBIAN/control"

        # postinst
        cp "${ACTION_TEMPLATES}/DEBIAN/postinst" "${PACKAGE_ROOT}/DEBIAN/postinst"
        chmod 755 "${PACKAGE_ROOT}/DEBIAN/postinst"

        # prerm
        cp "${ACTION_TEMPLATES}/DEBIAN/prerm" "${PACKAGE_ROOT}/DEBIAN/prerm"
        chmod 755 "${PACKAGE_ROOT}/DEBIAN/prerm"

        # postrm
        cp "${ACTION_TEMPLATES}/DEBIAN/postrm" "${PACKAGE_ROOT}/DEBIAN/postrm"
        chmod 755 "${PACKAGE_ROOT}/DEBIAN/postrm"

        # dpkg refuses a control directory it considers world-writable, and the
        # runner's umask leaves every mkdir at 777. The scripts inside are given
        # 755 above; the directory holding them needs the same.
        chmod 0755 "${PACKAGE_ROOT}/DEBIAN"

        # Build package
        dpkg-deb --build "${PACKAGE_ROOT}"
        mkdir -p "./packages/apt/pool/main/n/nomercy"
        mv "${PACKAGE_ROOT}.deb" "./packages/apt/pool/main/n/nomercy/nomercy_${VERSION}_amd64.deb"
        cd "./packages/apt/pool/main/n/nomercy"
        ln -sf "nomercy_${VERSION}_amd64.deb" "nomercy_latest_amd64.deb"
        cd ../../../../../..
        echo "Successfully created nomercy DEB package"

        # Update package index
        mkdir -p packages/apt/dists/stable/main/binary-amd64
        cd packages/apt
        rm -f dists/stable/main/binary-amd64/Packages*
        dpkg-scanpackages --multiversion pool/ > dists/stable/main/binary-amd64/Packages
        gzip -k -f dists/stable/main/binary-amd64/Packages

    - name: Verify DEB installs on Ubuntu and Debian
      shell: bash
      run: bash "${{ github.action_path }}/verify-install.sh" packages/apt/pool/main/n/nomercy

    - name: Upload DEB artifacts
      uses: actions/upload-artifact@v7
      with:
        name: deb-packages
        path: packages/apt/

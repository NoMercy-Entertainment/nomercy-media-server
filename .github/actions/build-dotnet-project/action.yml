name: 'Build .NET Project'
description: 'Builds a .NET project for all platforms (Linux, Windows, macOS)'
author: 'NoMercy Entertainment'

inputs:
  project:
    description: 'Project name (Service, App, Launcher, Cli)'
    required: true
  dotnet-version:
    description: '.NET version to use'
    required: false
    default: '10.0.x'
  app-repo-token:
    description: 'Token for accessing the private nomercy-app-web repo'
    required: false
    default: ''

outputs:
  artifact-name:
    description: 'Name of the uploaded artifact'
    value: ${{ steps.upload.outputs.artifact-id }}

runs:
  using: 'composite'
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Set up Node.js
      if: inputs.project == 'App'
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Heal NuGet cache
      uses: ./.github/actions/heal-nuget-cache

    - name: Restore dependencies
      shell: bash
      run: dotnet restore NoMercy.Server.sln

    - name: Verify app repo token
      if: inputs.project == 'App'
      shell: bash
      run: |
        if [ -z "${{ inputs.app-repo-token }}" ]; then
          echo "::error::app-repo-token is empty. The nomercy-app-web gh-pages checkout needs a valid PAT (org secret PAT); github.token cannot read that private repo."
          exit 1
        fi

    - name: Pull App Files
      if: inputs.project == 'App'
      uses: actions/checkout@v5
      with:
        repository: NoMercy-Entertainment/nomercy-app-web
        token: ${{ inputs.app-repo-token }}
        path: ./src/NoMercy.App/Resources/wwwroot
        fetch-depth: 1
        fetch-tags: false
        ref: gh-pages

    - name: Move App Files
      if: inputs.project == 'App'
      shell: bash
      run: |
        # InfiniFrame uses wwwroot directory for static files
        mkdir -p ./src/NoMercy.App/wwwroot
        # Remove the checkout's wwwroot if it exists (the gh-pages content)
        rm -rf ./src/NoMercy.App/Resources/wwwroot/.git
        # Move files from Resources/wwwroot to wwwroot
        mv ./src/NoMercy.App/Resources/wwwroot/* ./src/NoMercy.App/wwwroot/ || true
        # Clean up
        rm -rf ./src/NoMercy.App/Resources/wwwroot

    # Note: InfiniFrame script injection is now handled at runtime by EmbeddedStaticAssetsMiddleware
    # See src/NoMercy.App/Program.cs for the injection configuration

    - name: Copy InfiniFrame.js to wwwroot
      if: inputs.project == 'App'
      shell: bash
      run: |
        # Copy InfiniFrame.js from NuGet package to wwwroot for embedding
        # This is needed because StaticWebAssetsEnabled=false disables automatic RCL asset copying
        mkdir -p ./src/NoMercy.App/wwwroot/_content/InfiniLore.InfiniFrame.Js

        # Find the InfiniFrame.Js package in the NuGet cache
        NUGET_CACHE="${HOME}/.nuget/packages"
        INFINIFRAME_PKG=$(find "$NUGET_CACHE/infinilore.infiniframe.js" -maxdepth 1 -type d | sort -V | tail -1)

        if [ -d "$INFINIFRAME_PKG/staticwebassets" ]; then
          cp "$INFINIFRAME_PKG/staticwebassets/InfiniFrame.js" "./src/NoMercy.App/wwwroot/_content/InfiniLore.InfiniFrame.Js/"
          echo "InfiniFrame.js copied from $INFINIFRAME_PKG"
        else
          echo "Warning: InfiniFrame.js not found in NuGet cache"
          exit 1
        fi

    - name: Build Project for All Platforms
      shell: bash
      run: |
        mkdir -p ./output
        
        PROJECT_PATH="./src/NoMercy.${{ inputs.project }}/NoMercy.${{ inputs.project }}.csproj"
        
        # Set correct project names based on actual target names
        if [ "${{ inputs.project }}" == "Service" ]; then
          PROJECT_NAME="NoMercyMediaServer"
        elif [ "${{ inputs.project }}" == "Cli" ]; then
          PROJECT_NAME="nomercy"
        elif [ "${{ inputs.project }}" == "Launcher" ]; then
          PROJECT_NAME="NoMercyLauncher"
        else
          PROJECT_NAME="NoMercy${{ inputs.project }}"
        fi

        # Note: PublishTrimmed is disabled for App to avoid issues with InfiniFrame native dependencies
        TRIMMED_FLAG=""

        echo "Building $PROJECT_NAME for all platforms..."
        
        # Linux Build
        echo "Building for Linux..."
        dotnet publish "$PROJECT_PATH" \
          --configuration Release \
          --runtime linux-x64 \
          --self-contained true \
          /p:PublishSingleFile=true \
          /p:IncludeNativeLibrariesForSelfExtract=true \
          /p:IncludeAllContentForSelfExtract=true \
          /p:EnableCompressionInSingleFile=true \
          /p:DebugType=None \
          /p:DebugSymbols=false \
          /p:PublishReadyToRun=false \
          /p:OutputFileName="$PROJECT_NAME" \
          $TRIMMED_FLAG \
          --output ./output
        mv "./output/$PROJECT_NAME" "./output/$PROJECT_NAME-linux-x64"
        
        # Windows Build
        echo "Building for Windows..."
        dotnet publish "$PROJECT_PATH" \
          --configuration Release \
          --runtime win-x64 \
          --self-contained true \
          /p:PublishSingleFile=true \
          /p:IncludeNativeLibrariesForSelfExtract=true \
          /p:IncludeAllContentForSelfExtract=true \
          /p:EnableCompressionInSingleFile=true \
          /p:DebugType=None \
          /p:DebugSymbols=false \
          /p:PublishReadyToRun=false \
          /p:OutputFileName="$PROJECT_NAME" \
          $TRIMMED_FLAG \
          --output ./output
        mv "./output/$PROJECT_NAME.exe" "./output/$PROJECT_NAME-windows-x64.exe"
        
        # macOS Build
        echo "Building for macOS..."
        dotnet publish "$PROJECT_PATH" \
          --configuration Release \
          --runtime osx-x64 \
          --self-contained true \
          /p:PublishSingleFile=true \
          /p:IncludeNativeLibrariesForSelfExtract=true \
          /p:IncludeAllContentForSelfExtract=true \
          /p:EnableCompressionInSingleFile=true \
          /p:DebugType=None \
          /p:DebugSymbols=false \
          /p:PublishReadyToRun=false \
          /p:OutputFileName="$PROJECT_NAME" \
          $TRIMMED_FLAG \
          --output ./output
        
        # macOS on Apple Silicon.
        #
        # Apple Silicon shipped in 2020 and every Mac sold since is arm64. The
        # x64 build runs under Rosetta where Rosetta is installed and not at all
        # where it is not, and the ffmpeg fork already ships arm64 — the server
        # was the piece holding it back.
        #
        # Its own output directory, because both publishes produce a file called
        # $PROJECT_NAME: into the same directory the second silently overwrites
        # the first and the asset labelled arm64 is x64.
        echo "Building for macOS (arm64)..."
        dotnet publish "$PROJECT_PATH" \
          --configuration Release \
          --runtime osx-arm64 \
          --self-contained true \
          /p:PublishSingleFile=true \
          /p:IncludeNativeLibrariesForSelfExtract=true \
          /p:IncludeAllContentForSelfExtract=true \
          /p:EnableCompressionInSingleFile=true \
          /p:DebugType=None \
          /p:DebugSymbols=false \
          /p:PublishReadyToRun=false \
          /p:OutputFileName="$PROJECT_NAME" \
          $TRIMMED_FLAG \
          --output ./output-osx-arm64

        # The x64 asset keeps its exact name. The packages repo and the download
        # URLs on nomercy-tv pin these filenames, so arm64 is an addition and
        # never a rename.
        mv "./output-osx-arm64/$PROJECT_NAME" "./output/$PROJECT_NAME-macos-arm64"

        echo "Build completed for all platforms!"

    - name: Create macOS App Bundle
      if: inputs.project != 'Cli'
      shell: bash
      run: |
        # Set correct project names based on actual target names
        if [ "${{ inputs.project }}" == "Service" ]; then
          PROJECT_NAME="NoMercyMediaServer"
        elif [ "${{ inputs.project }}" == "Launcher" ]; then
          PROJECT_NAME="NoMercyLauncher"
        else
          PROJECT_NAME="NoMercy${{ inputs.project }}"
        fi

        echo "Creating macOS App Bundle for $PROJECT_NAME..."
        mkdir -p "./output/$PROJECT_NAME.app/Contents/MacOS"
        mkdir -p "./output/$PROJECT_NAME.app/Contents/Resources"
        cp "./output/$PROJECT_NAME" "./output/$PROJECT_NAME.app/Contents/MacOS/"

        # Copy appropriate Info.plist based on project
        if [ "${{ inputs.project }}" == "Service" ]; then
          cp ./assets/macos/Info.plist "./output/$PROJECT_NAME.app/Contents/"
        elif [ "${{ inputs.project }}" == "Launcher" ]; then
          cp ./assets/macos/Info.plist.service "./output/$PROJECT_NAME.app/Contents/Info.plist"
        else
          cp ./assets/macos/Info.plist.app "./output/$PROJECT_NAME.app/Contents/Info.plist"
        fi

        cp ./assets/icons/icon.icns "./output/$PROJECT_NAME.app/Contents/Resources/AppIcon.icns"
        chmod +x "./output/$PROJECT_NAME.app/Contents/MacOS/$PROJECT_NAME"

        # Create tar.gz for the app bundle
        tar -czf "./output/$PROJECT_NAME-macos-x64.tar.gz" -C ./output "$PROJECT_NAME.app"

        # Keep the raw binary for other uses
        mv "./output/$PROJECT_NAME" "./output/$PROJECT_NAME-macos-x64"

        # The same bundle for Apple Silicon. The layout is already built, so the
        # binary inside it is swapped and it is tarred again — an arm64 Mac
        # should get a .app like everyone else, not only a raw binary.
        cp "./output/$PROJECT_NAME-macos-arm64" \
           "./output/$PROJECT_NAME.app/Contents/MacOS/$PROJECT_NAME"
        chmod +x "./output/$PROJECT_NAME.app/Contents/MacOS/$PROJECT_NAME"
        tar -czf "./output/$PROJECT_NAME-macos-arm64.tar.gz" -C ./output "$PROJECT_NAME.app"

        echo "macOS App Bundles created successfully!"

    - name: Rename macOS CLI binary
      if: inputs.project == 'Cli'
      shell: bash
      run: |
        PROJECT_NAME="nomercy"
        mv "./output/$PROJECT_NAME" "./output/$PROJECT_NAME-macos-x64"
        echo "Renamed CLI binary for macOS."

    # create-dmg drives hdiutil, and its appdmg dependency is darwin-only, so on
    # the Linux runner this pipeline builds on it failed at npm install every
    # time. continue-on-error hid that from the job result and left a red error
    # in the log of every leg. No .dmg has ever reached a release: the release
    # workflow's find for one simply matches nothing.
    - name: Create DMG (macOS Installer)
      if: inputs.project != 'Cli' && runner.os == 'macOS'
      shell: bash
      continue-on-error: true
      run: |
        # Set correct project names based on actual target names
        if [ "${{ inputs.project }}" == "Service" ]; then
          PROJECT_NAME="NoMercyMediaServer"
        elif [ "${{ inputs.project }}" == "Launcher" ]; then
          PROJECT_NAME="NoMercyLauncher"
        else
          PROJECT_NAME="NoMercy${{ inputs.project }}"
        fi

        echo "Creating DMG for $PROJECT_NAME..."
        npm install -g create-dmg
        
        npx create-dmg \
          "./output/$PROJECT_NAME.app" \
          ./output \
          --overwrite \
          --no-code-sign \
          --dmg-title="$PROJECT_NAME" \
          --window-size 500 300 \
          --icon-size 128 \
          --icon "$PROJECT_NAME.app" 100 150 \
          --app-drop-link 400 150 || echo "DMG creation failed, continuing..."
        
        # Rename DMG with consistent naming (find any created DMG and rename it)
        find ./output -name "*.dmg" -not -name "*$PROJECT_NAME*" -exec mv {} "./output/$PROJECT_NAME-macos-x64.dmg" \; || echo "No DMG to rename"
        
        echo "DMG creation completed!"

    - name: List Generated Files
      shell: bash
      run: |
        echo "Generated files:"
        ls -la ./output/

    - name: Upload Artifacts
      id: upload
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.project }}-executables
        path: ./output/*
        retention-days: 30

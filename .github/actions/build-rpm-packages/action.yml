name: 'Build RPM Packages'
description: 'Build CentOS/RHEL/Fedora packages with shared runtime'
inputs:
  version:
    description: 'Package version'
    required: true
  dotnet-version:
    description: '.NET version to use'
    required: false
    default: '10.0.x'
  gpg-private-key:
    description: 'GPG private key for signing'
    required: true
  app-repo-token:
    description: 'Token for accessing the private nomercy-app-web repo'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Build shared runtime payload
      uses: ./.github/actions/build-linux-installer-payload
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
        app-repo-token: ${{ inputs.app-repo-token }}

    - name: Repair runner apt state
      uses: ./.github/actions/repair-runner-apt-state

    - name: Install RPM build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends rpm createrepo-c

    - name: Build RPM packages
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        PAYLOAD_PATH="./installer-payload"
        INSTALL_DIR="/opt/nomercy"

        # Setup RPM build environment
        mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

        # Copy payload as a tarball for RPM source
        tar -czf ~/rpmbuild/SOURCES/nomercy-payload.tar.gz -C "${PAYLOAD_PATH}" .

        # Copy desktop files and icon
        cp ./assets/linux/NoMercy-MediaServer.desktop ~/rpmbuild/SOURCES/ 2>/dev/null || true
        cp ./assets/linux/NoMercy-MediaServer-Service.desktop ~/rpmbuild/SOURCES/ 2>/dev/null || true
        cp ./assets/icons/icon.png ~/rpmbuild/SOURCES/

        # Systemd service files + README are real checked-in templates,
        # staged as RPM sources and installed via `install -m 644 %{SOURCEn}`
        # in the spec — same idea as the desktop file/icon sources below,
        # replacing what used to be a heredoc nested inside a heredoc.
        ACTION_TEMPLATES="${{ github.action_path }}/templates"
        cp "${ACTION_TEMPLATES}/nomercymediaserver.service" ~/rpmbuild/SOURCES/
        cp "${ACTION_TEMPLATES}/nomercylauncher.service" ~/rpmbuild/SOURCES/
        cp "${ACTION_TEMPLATES}/README" ~/rpmbuild/SOURCES/

        # Spec file generated from the real checked-in templates/nomercy.spec
        # by substituting {{VERSION}}/{{CHANGELOG_DATE}} — same pattern as
        # build-arch-packages and generate-repository-website.
        sed \
          -e "s/{{VERSION}}/${VERSION}/g" \
          -e "s/{{CHANGELOG_DATE}}/$(date '+%a %b %d %Y')/g" \
          "${ACTION_TEMPLATES}/nomercy.spec" \
          > ~/rpmbuild/SPECS/nomercy.spec

        echo "Staged nomercy.spec:"
        cat ~/rpmbuild/SPECS/nomercy.spec

        # Build RPM
        rpmbuild -bb ~/rpmbuild/SPECS/nomercy.spec

        # Copy to packages directory
        mkdir -p packages/rpm/pool/x86_64
        find ~/rpmbuild/RPMS -name "*.rpm" -exec cp {} packages/rpm/pool/x86_64/ \;
        echo "Successfully created nomercy RPM package"

        # Generate repo metadata
        createrepo_c packages/rpm

    - name: Verify RPM installs on Fedora
      shell: bash
      run: bash "${{ github.action_path }}/verify-install.sh" packages/rpm/pool/x86_64

    - name: Sign RPM repository
      shell: bash
      run: |
        echo "${{ inputs.gpg-private-key }}" | gpg --batch --import
        cd packages/rpm
        gpg --armor --detach-sig -o repodata/repomd.xml.asc repodata/repomd.xml

    - name: Upload RPM artifacts
      uses: actions/upload-artifact@v7
      with:
        name: rpm-packages
        path: packages/rpm/

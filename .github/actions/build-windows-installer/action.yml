name: 'Build Windows Installer'
description: 'Build Windows installer using Inno Setup'
inputs:
  version:
    description: 'Package version'
    required: true
  commit-sha:
    description: '7-char git commit SHA to embed in the installer VersionInfo'
    required: false
    default: 'unknown'
  dotnet-version:
    description: '.NET version to use'
    required: false
    default: '10.0.x'
  app-repo-token:
    description: 'Token for accessing the private nomercy-app-web repo'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Build shared runtime payload
      uses: ./.github/actions/build-windows-installer-payload
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
        app-repo-token: ${{ inputs.app-repo-token }}

    - name: Install Inno Setup
      shell: pwsh
      run: |
        # Pinned to a known-good stable release. "latest" now resolves to a 7.x beta
        # whose assets are arch-suffixed (innosetup-7.0.1-beta-x64.exe) and no longer
        # match a plain innosetup-X.Y.Z.exe; pinning keeps the build reproducible.
        # Bump $InnoTag + $InnoAsset together to update.
        $InnoTag = 'is-6_7_3'
        $InnoAsset = 'innosetup-6.7.3.exe'
        $InnoUrl = "https://github.com/jrsoftware/issrc/releases/download/$InnoTag/$InnoAsset"
        $InstallerPath = "$env:TEMP\innosetup.exe"

        for ($attempt = 1; $attempt -le 3 -and -not (Test-Path "C:\InnoSetup\ISCC.exe"); $attempt++) {
          Write-Host "Attempt ${attempt}: downloading $InnoAsset ($InnoTag)..."
          try {
            Invoke-WebRequest -Uri $InnoUrl -OutFile $InstallerPath -UseBasicParsing -TimeoutSec 90
            Write-Host "Downloaded $((Get-Item $InstallerPath).Length) bytes. Installing Inno Setup..."
            $proc = Start-Process -FilePath $InstallerPath -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/DIR=C:\InnoSetup' -PassThru
            if (-not $proc.WaitForExit(180000)) { $proc.Kill(); Write-Host "Installer timed out" }
            else { Write-Host "Installer exit code $($proc.ExitCode)" }
          } catch {
            Write-Host "Attempt $attempt failed: $_"
          }
        }

        if (-not (Test-Path "C:\InnoSetup\ISCC.exe")) {
          Write-Host "Falling back to Chocolatey"
          choco install innosetup -y --no-progress
          $found = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) { New-Item -ItemType Directory -Force C:\InnoSetup | Out-Null; Copy-Item (Join-Path (Split-Path $found.FullName) '*') C:\InnoSetup -Recurse -Force }
        }

        if (Test-Path "C:\InnoSetup\ISCC.exe") {
          Write-Host "Inno Setup installed successfully"
        } else {
          Write-Error "Inno Setup installation failed - ISCC.exe not found"
          exit 1
        }

    - name: Build Windows Installer
      shell: pwsh
      run: |
        $Version = "${{ inputs.version }}"
        $CommitSha = "${{ inputs.commit-sha }}"
        $IssFile = "./src/NoMercy.Service/NoMercyMediaServer.iss"
        $InnoCompiler = "C:\InnoSetup\ISCC.exe"

        New-Item -ItemType Directory -Force -Path "./packages/windows" | Out-Null

        & $InnoCompiler "/DVersion=$Version" "/DCommitSha=$CommitSha" "/O./packages/windows" $IssFile

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Inno Setup compilation failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }

        Write-Host "Windows installer created:"
        Get-ChildItem "./packages/windows/"

    - name: Upload Windows installer artifacts
      uses: actions/upload-artifact@v7
      with:
        name: windows-installer
        path: packages/windows/

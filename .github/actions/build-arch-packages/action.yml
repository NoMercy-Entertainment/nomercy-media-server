name: 'Build Arch Packages'
description: 'Build Arch Linux packages with shared runtime'
inputs:
  version:
    description: 'Package version'
    required: true
  dotnet-version:
    description: '.NET version to use'
    required: false
    default: '10.0.x'
  app-repo-token:
    description: 'Token for accessing the private NoMercyApp repo'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Build shared runtime payload
      uses: ./.github/actions/build-linux-installer-payload
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
        app-repo-token: ${{ inputs.app-repo-token }}

    - name: Pull Arch build container
      shell: bash
      run: |
        # A single attempt makes the whole Arch package depend on Docker Hub answering on the
        # first try. When it times out ("context deadline exceeded") the job fails, the release
        # ships without an Arch package, and Arch users silently get no update for that version.
        for attempt in 1 2 3 4 5; do
          if docker pull archlinux:base-devel; then
            exit 0
          fi
          delay=$((attempt * 15))
          echo "docker pull failed (attempt ${attempt}/5), retrying in ${delay}s"
          sleep "${delay}"
        done

        echo "::error::Could not pull archlinux:base-devel after 5 attempts"
        exit 1

    - name: Stage Arch package sources
      shell: bash
      run: |
        VERSION="${{ inputs.version }}"
        PAYLOAD_PATH="./installer-payload"
        BUILD_DIR="arch-build"

        rm -rf "${BUILD_DIR}"
        mkdir -p "${BUILD_DIR}/payload" "${BUILD_DIR}/assets"

        # Stage the shared runtime payload
        cp -R "${PAYLOAD_PATH}/." "${BUILD_DIR}/payload/"
        chmod 755 "${BUILD_DIR}/payload/NoMercyMediaServer"
        chmod 755 "${BUILD_DIR}/payload/NoMercyApp"
        chmod 755 "${BUILD_DIR}/payload/NoMercyLauncher"
        chmod 755 "${BUILD_DIR}/payload/nomercy"

        # Stage desktop files + icon for PKGBUILD's package()
        for df in NoMercy-MediaServer.desktop NoMercy-MediaServer-Service.desktop NoMercy-App.desktop; do
          if [ -f "./assets/linux/${df}" ]; then
            cp "./assets/linux/${df}" "${BUILD_DIR}/assets/"
          fi
        done
        cp "./assets/icons/icon.png" "${BUILD_DIR}/assets/icon.png"

        # PKGBUILD packages the prebuilt payload (no compile step, package()
        # only). Generated from the real checked-in templates/PKGBUILD by
        # substituting {{VERSION}} — same pattern as generate-repository-website.
        sed "s/{{VERSION}}/${VERSION}/g" \
          "${{ github.action_path }}/templates/PKGBUILD" \
          > "${BUILD_DIR}/PKGBUILD"

        echo "Staged PKGBUILD:"
        cat "${BUILD_DIR}/PKGBUILD"

    - name: Build Arch package with makepkg
      shell: bash
      run: |
        set -euo pipefail
        BUILD_DIR="$(pwd)/arch-build"
        OUT_DIR="$(pwd)/packages/arch/pool/x86_64"
        mkdir -p "${OUT_DIR}"

        # makepkg refuses to run as root and needs real Arch tooling
        # (fakeroot, bsdtar) to produce a correctly-ordered archive with a
        # valid .PKGINFO/.MTREE — that guarantee is why this runs makepkg
        # itself inside Arch rather than hand-assembling the tarball.
        # makepkg produces files owned by the in-container 'builder' uid; chown
        # them back to the runner at the end so the host cleanup (rm -rf) and the
        # post-job checkout cleanup can remove them without a permission error.
        # The uid/gid are evaluated on the host and passed as explicit env values
        # (the value-less `-e HOST_UID` form only forwards an already-exported var,
        # which these are not — that left them unbound under the container's set -u).
        docker run --rm -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -v "${BUILD_DIR}:/build" -w /build archlinux:base-devel bash -c '
          set -euo pipefail
          pacman -Sy --noconfirm
          useradd -m builder
          chown -R builder:builder /build
          su builder -c "cd /build && makepkg -f --noconfirm"
          chown -R "${HOST_UID}:${HOST_GID}" /build
        '

        pkg_file=$(ls "${BUILD_DIR}"/*.pkg.tar.zst | head -n1)
        cp "${pkg_file}" "${OUT_DIR}/"
        rm -rf "${BUILD_DIR}"
        echo "Successfully created nomercy Arch package: $(basename "${pkg_file}")"

    - name: Generate Arch repository database
      shell: bash
      run: |
        set -euo pipefail
        OUT_DIR="$(pwd)/packages/arch/pool/x86_64"

        if ! ls "${OUT_DIR}"/*.pkg.tar.zst >/dev/null 2>&1; then
          echo "ERROR: No package files found"
          exit 1
        fi

        # repo-add is the real Arch tool for sync-db generation — it produces
        # a valid nomercy.db.tar.gz (+ nomercy.db symlink) that pacman -Sy can
        # actually parse, unlike a hand-rolled text file.
        docker run --rm -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -v "${OUT_DIR}:/repo" -w /repo archlinux:base-devel bash -c '
          set -euo pipefail
          pacman -Sy --noconfirm --needed pacman-contrib
          useradd -m builder
          chown -R builder:builder /repo
          su builder -c "cd /repo && repo-add nomercy.db.tar.gz *.pkg.tar.zst"
          chown -R "${HOST_UID}:${HOST_GID}" /repo
        '

        echo "Created Arch repository:"
        ls -la "${OUT_DIR}"

    - name: Verify Arch package installs
      shell: bash
      run: bash "${{ github.action_path }}/verify-install.sh" packages/arch/pool/x86_64

    - name: Upload Arch artifacts
      uses: actions/upload-artifact@v7
      with:
        name: arch-packages
        path: packages/arch/

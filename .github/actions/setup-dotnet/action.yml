name: 'Setup .NET Environment'
description: 'Common setup steps for .NET projects including .NET setup, caching, and restore (requires checkout first)'

inputs:
  dotnet-version:
    description: '.NET version to use'
    required: false
    default: '10.0.x'

runs:
  using: 'composite'
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Cache NuGet packages
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        # Named paths, not '**': the key is hashed again in the post step, after a
        # test run has filled every bin/ and obj/, and walking that tree blew the
        # 120 s hashFiles budget and failed jobs whose tests had all passed.
        key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', 'src/*/*.csproj', 'tests/*/*.csproj', 'benchmarks/*/*.csproj', 'templates/*/*.csproj', 'templates/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      shell: bash
      run: dotnet restore NoMercy.Server.sln --verbosity minimal

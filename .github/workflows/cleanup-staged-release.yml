name: Cleanup Staged Release

# Staged Release makes one draft release and tag per feature branch.
# This removes them when the branch is merged, closed or deleted,
# so drafts never outlive their branch.

on:
  pull_request:
    types: [closed]
  delete:

permissions:
  contents: write

jobs:
  cleanup:
    # delete fires for tags too; a fork PR gets a read-only token.
    if: >-
      (github.event_name == 'delete' && github.event.ref_type == 'branch') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Delete the branch's draft releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event_name == 'delete' && github.event.ref || github.head_ref }}
        run: |
          # Same slug as staged-release.yml "Compute tag".
          SAFE_BRANCH=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g' | cut -c1-50)
          gh release list --limit 200 --json tagName,isDraft \
            | jq -r --arg b "$SAFE_BRANCH" '.[] | select(.isDraft and ((.tagName | sub("^v[0-9.]+-"; "")) == $b)) | .tagName' \
            | while read -r tag; do
                echo "Deleting draft release: $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done

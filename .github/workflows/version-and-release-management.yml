name: 'Version and Release Management'

on:
  workflow_call:
    outputs:
      version:
        description: 'Calculated version for the next release'
        value: ${{ jobs.version_management.outputs.version }}
      should_deploy:
        description: 'Whether deployment should proceed'
        value: ${{ jobs.version_management.outputs.should_deploy }}

jobs:
  version_management:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","beast-unit"]') || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.calc-version.outputs.new_version }}
      should_deploy: ${{ steps.check-deploy.outputs.should_deploy }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get latest tag
        id: get-tag
        run: |
          # Global latest semver tag across the WHOLE repo, not an ancestry-based
          # `git describe`. Ancestry lookup resolves to whatever tag is reachable
          # from THIS ref's history, which on dev (never tag-resynced after
          # master-only releases) can be several versions behind the true latest
          # published release. Bumping from a stale ancestor recomputes a version
          # that already has a real GitHub Release + ghcr.io image, and the
          # create-release job's "already exists -> edit/clobber" path then
          # overwrites that historical release.
          # Plain vMAJOR.MINOR.PATCH only: a suffixed tag (a staged branch
          # build) must never be read as the line's newest version.
          LATEST_TAG=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="0.1.201"
          fi
          echo "tag=v$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "Global latest tag: v$LATEST_TAG"

      - name: Test the release-change check
        if: github.ref == 'refs/heads/dev'
        run: bash .github/scripts/has-release-changes.test.sh

      - name: Check for source changes
        id: check-changes
        if: github.ref == 'refs/heads/dev'
        run: |
          if [[ "${{ github.event_name }}" == "release" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "has_source_changes=true" >> "$GITHUB_OUTPUT"
            echo "Release or manual trigger - proceeding with full pipeline"
          else
            # src/ or a package action changed since the last tag: a packaging fix alone must release too.
            # The assignment fails the step when the check itself fails, instead of silently skipping a release.
            LATEST_TAG="${{ steps.get-tag.outputs.tag }}"
            CHANGED="$(bash .github/scripts/has-release-changes.sh "$LATEST_TAG" HEAD)"
            if [[ "$CHANGED" == "true" ]]; then
              echo "has_source_changes=true" >> "$GITHUB_OUTPUT"
              echo "Release changes detected since $LATEST_TAG - proceeding with version bump and full pipeline"
            else
              echo "has_source_changes=false" >> "$GITHUB_OUTPUT"
              echo "No source or package changes detected since $LATEST_TAG"
            fi
          fi

      - name: Calculate new version
        id: calc-version
        if: steps.check-changes.outputs.has_source_changes == 'true'
        run: |
          # The patch bumps on every nightly. The release line in
          # .github/release-line decides MAJOR.MINOR: raising it (0.1 -> 1.0)
          # makes the next nightly 1.0.0. See next-version.sh.
          LATEST_TAG="${{ steps.get-tag.outputs.tag }}"
          NEW_VERSION=$(bash .github/scripts/next-version.sh "$LATEST_TAG" "$(cat .github/release-line)")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Calculated new version: $NEW_VERSION (from tag $LATEST_TAG, release line $(cat .github/release-line))"

      - name: Check deployment conditions
        id: check-deploy
        run: |
          if [[ "${{ github.event_name }}" == "release" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]] && [[ "${{ steps.check-changes.outputs.has_source_changes }}" == "true" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

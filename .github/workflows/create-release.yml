name: 'Create Release Workflow'
# Uses PAT for push to master (GITHUB_TOKEN cannot push .github/ changes)
on:
  workflow_call:
    inputs:
      version:
        description: 'Version to release'
        required: true
        type: string
      tag:
        description: 'Git tag for the release (defaults to v{version})'
        required: false
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false
      release-name:
        description: 'Release title (defaults to NoMercy MediaServer v{version})'
        required: false
        type: string
    secrets:
      PAT:
        description: 'PAT for pushing to master'
        required: true
      GPG_PRIVATE_KEY:
        description: 'ASCII-armored GPG private key for signing the release manifest'
        required: false

jobs:
  create_release:
    runs-on: [self-hosted, Linux, X64, beast-unit]

    steps:
      - name: Disable autocrlf before checkout
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.PAT }}

      - name: Download executable artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: '*-executables'

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: '*-packages'

      - name: Download installer artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: '*-installer'

      - name: Combine artifacts
        run: |
          mkdir -p ./output

          # Copy executable artifacts (exclude package archives)
          find ./artifacts -name "*.tar.gz" -not -path "*/arch-packages/*" -not -path "*/rpm-packages/*" -exec cp {} ./output/ \;
          find ./artifacts -name "*.dmg" -exec cp {} ./output/ \;
          find ./artifacts -name "*-linux-x64" -exec cp {} ./output/ \;
          find ./artifacts -name "*-windows-x64.exe" -exec cp {} ./output/ \;
          find ./artifacts -name "*-macos-x64" -exec cp {} ./output/ \;
          find ./artifacts -name "*-macos-arm64" -exec cp {} ./output/ \;

          # Copy Linux packages to release
          find ./artifacts -path "*/deb-packages/*" -name "*.deb" -exec cp {} ./output/ \;
          find ./artifacts -path "*/rpm-packages/*" -name "*.rpm" -exec cp {} ./output/ \;
          find ./artifacts -path "*/arch-packages/*" -name "*.pkg.tar.zst" -exec cp {} ./output/ \;

          # Copy Windows installer to release
          find ./artifacts -path "*/windows-installer/*" -name "*-setup.exe" -exec cp {} ./output/ \;

          # Copy macOS installer to release
          find ./artifacts -path "*/macos-installer/*" -name "*.pkg" -exec cp {} ./output/ \;

          # Copy Docker Compose files to release
          cp ./docker-compose*.yml ./output/

          echo "=== Release artifacts ==="
          ls -la ./output/

      # The contract a third-party plugin is written against. A plugin living
      # outside this repository cannot use a ProjectReference, so without a
      # published package its author is copying a DLL out of somebody's build
      # and every contract added here is invisible until they do.
      #
      # Before the checksum step, so the packages are hashed and listed like
      # every other asset, and before the master push, so a failure here costs
      # a red job rather than a version bump with nothing behind it.
      - name: Set up .NET for packing
        uses: ./.github/actions/setup-dotnet
        with:
          dotnet-version: "10.0.x"

      - name: Pack the plugin contract
        run: |
          # Events too: Abstractions depends on it, and a package whose
          # dependency cannot be restored is a package nobody can use.
          for project in NoMercy.Events NoMercy.Plugins.Abstractions; do
            dotnet pack "src/$project/$project.csproj"               --configuration Release               -p:Version=${{ inputs.version }}               --output ./output
          done

      - name: Generate SHA-256 checksums and release-info.json
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="${{ inputs.version }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Write release-info.json — the launcher can optionally fetch this to verify
          # which commit a release was built from
          cat > ./output/release-info.json << EOF
          {
            "version": "${VERSION}",
            "commit_sha": "${SHORT_SHA}",
            "build_timestamp": "${TIMESTAMP}"
          }
          EOF

          echo "=== Release artifacts ==="
          ls -la ./output/

      - name: Generate manifest.json and SHA-256 sidecars
        uses: ./.github/actions/generate-release-manifest
        with:
          output-dir: ./output
          version: ${{ inputs.version }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Write release notes
        run: |
          VERSION="${{ inputs.version }}"
          TAG="${{ inputs.tag || format('v{0}', inputs.version) }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          REPO="https://github.com/NoMercy-Entertainment/nomercy-media-server"
          DL="${REPO}/releases/download/${TAG}"

          cat > /tmp/release-notes.md << NOTES_END
          ## Install

          | Platform | Download |
          |----------|----------|
          | **Windows** | [NoMercyMediaServer-${VERSION}-windows-x64-setup.exe](${DL}/NoMercyMediaServer-${VERSION}-windows-x64-setup.exe) |
          | **macOS** | [NoMercyMediaServer-${VERSION}-macos-x64-setup.pkg](${DL}/NoMercyMediaServer-${VERSION}-macos-x64-setup.pkg) |
          | **Linux** | [repo.nomercy.tv](https://repo.nomercy.tv) — see [setup instructions](${REPO}#installation) |
          | **Docker** | See Docker section below |

          ## Docker

          \`\`\`bash
          # CPU only
          docker pull ghcr.io/nomercy-entertainment/nomercymediaserver:latest
          docker pull ghcr.io/nomercy-entertainment/nomercymediaserver:${VERSION}

          # NVIDIA GPU
          docker pull ghcr.io/nomercy-entertainment/nomercymediaserver:nvidia

          # Intel Quick Sync
          docker pull ghcr.io/nomercy-entertainment/nomercymediaserver:intel

          # AMD GPU
          docker pull ghcr.io/nomercy-entertainment/nomercymediaserver:amd
          \`\`\`

          Or use Docker Compose — see \`docker-compose.yml\` (and GPU variants) in the repo.

          ## What's New

          Latest features, improvements, and bug fixes for NoMercy MediaServer.

          ## All Assets

          All standalone binaries and Linux packages (.deb, .rpm, .pkg.tar.zst) are available in the assets below.

          ## Feedback

          Found a bug? [Open an issue](${REPO}/issues).

          ---
          Build: \`${SHORT_SHA}\`
          NOTES_END

      - name: Sync dev tree to master and bump version
        env:
          PAT: ${{ secrets.PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          NEW_VERSION="${{ inputs.version }}"
          TAG="${{ inputs.tag || format('v{0}', inputs.version) }}"

          # Use PAT explicitly for push - avoids 403 when GITHUB_TOKEN
          # identity is rejected by the org for pushing to master.
          git remote set-url origin "https://x-access-token:${PAT}@github.com/NoMercy-Entertainment/nomercy-media-server.git"

          # Fetch latest state of both branches
          git fetch origin master dev

          # Generate changelog from commits since last tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.201")

          # Get commits since last tag, excluding version bump commits
          COMMITS=$(git log "$LATEST_TAG"..origin/dev --pretty=format:"%s" -- src/ | grep -v "^chore: bump version" || true)

          # Initialize changelog sections
          FEATURES=""
          FIXES=""
          REFACTOR=""
          OTHER=""

          while IFS= read -r line; do
            [[ -z "$line" ]] && continue

            # Extract message without scope for cleaner output
            MSG=$(echo "$line" | sed -E 's/^[a-z]+(\([^)]+\))?:\s*//')

            if [[ "$line" =~ ^feat ]]; then
              FEATURES="${FEATURES}- ${MSG}"$'\n'
            elif [[ "$line" =~ ^fix ]]; then
              FIXES="${FIXES}- ${MSG}"$'\n'
            elif [[ "$line" =~ ^refactor ]]; then
              REFACTOR="${REFACTOR}- ${MSG}"$'\n'
            elif [[ ! "$line" =~ ^(chore|docs|style|test|ci) ]]; then
              OTHER="${OTHER}- ${MSG}"$'\n'
            fi
          done <<< "$COMMITS"

          # Build changelog body
          CHANGELOG=""
          [[ -n "$FEATURES" ]] && CHANGELOG="${CHANGELOG}### Features"$'\n'"${FEATURES}"$'\n'
          [[ -n "$FIXES" ]] && CHANGELOG="${CHANGELOG}### Fixes"$'\n'"${FIXES}"$'\n'
          [[ -n "$REFACTOR" ]] && CHANGELOG="${CHANGELOG}### Refactoring"$'\n'"${REFACTOR}"$'\n'
          [[ -n "$OTHER" ]] && CHANGELOG="${CHANGELOG}### Other"$'\n'"${OTHER}"$'\n'

          # Fallback if no categorized commits
          if [[ -z "$CHANGELOG" ]]; then
            CHANGELOG="Maintenance release with various improvements."
          fi

          echo "Generated changelog:"
          echo "$CHANGELOG"

          # Make master's tree byte-identical to dev's. This used to be a
          # squash merge (-X theirs), but a squash never records dev in
          # master's ancestry, so the merge-base stays ancient and any hunk
          # where only master differs from that stale base silently keeps
          # master's lines — code dev deleted came back from the dead. One
          # such zombie (AutoEncodeSubscriber's removed config-store gate)
          # made master uncompilable from v0.1.411 through v0.1.449 and
          # nothing noticed, because master itself is never built: binaries
          # come from dev and the release commit is [skip ci]. dev is the
          # release source and is what CI validated on this very push, so
          # master mirrors it exactly — no merge, no drift, nothing to build.
          git checkout -f master
          git reset --hard origin/master
          git read-tree -u --reset origin/dev

          # Update version in Directory.Build.props
          sed -i "s|<Version>.*</Version>|<Version>${NEW_VERSION}</Version>|" Directory.Build.props
          git add -A

          # Create the release commit with version and changelog.
          # [skip ci]: the release commit is this pipeline's own output; letting the
          # master push start another run would cancel this run's promote_docker_images
          # job (cancel-in-progress concurrency) and leave :latest unpromoted.
          #
          # A rerun of an already-completed release resets to the exact tree
          # master already carries, so there is nothing staged: git commit
          # would exit 1 on "nothing to commit" and fail a rerun that has
          # nothing left to do. Skip the commit and push in that case instead
          # of treating "already released" as an error.
          if git diff --cached --quiet; then
            echo "master is already at v$NEW_VERSION; nothing to sync"
          else
            git commit -m "release: v$NEW_VERSION [skip ci]" -m "$CHANGELOG"
            git push origin master
            echo "Synced dev tree onto master as v$NEW_VERSION"
          fi

      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag || format('v{0}', inputs.version) }}"
          NAME="${{ inputs.release-name || format('NoMercy MediaServer v{0}', inputs.version) }}"

          # Build gh release create flags
          FLAGS=(--title "$NAME" --notes-file /tmp/release-notes.md)

          if [ "${{ inputs.draft }}" = "true" ]; then
            FLAGS+=(--draft)
          fi

          if [ "${{ inputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi

          # Create release targeting master (where the release commit is)
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, updating..."
            gh release edit "$TAG" "${FLAGS[@]}"
          else
            gh release create "$TAG" "${FLAGS[@]}" --target master
          fi
          echo "Release ready: $TAG"

          # Upload assets with retry logic
          FAILED=0
          for file in ./output/*; do
            [ -f "$file" ] || continue
            BASENAME=$(basename "$file")
            echo "Uploading $BASENAME..."

            SUCCESS=false
            for i in 1 2 3; do
              if gh release upload "$TAG" "$file" --clobber 2>&1; then
                echo "Uploaded $BASENAME"
                SUCCESS=true
                break
              else
                echo "Upload attempt $i/3 failed for $BASENAME"
                sleep $((i * 2))
              fi
            done

            if [ "$SUCCESS" != "true" ]; then
              echo "Failed to upload $BASENAME after 3 attempts"
              FAILED=$((FAILED + 1))
            fi
          done

          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED asset(s) failed to upload"
            exit 1
          fi

          echo "All assets uploaded successfully"

      - name: Trigger package repository update
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          # A one-off transient failure here (seen once: a bare 403 with a
          # healthy token that pushed to master seconds earlier and dispatched
          # the same call cleanly the day before) used to fail the whole
          # release for a step with nothing actually wrong with its
          # credentials. Retry logic, matching the asset-upload loop above.
          SUCCESS=false
          for i in 1 2 3; do
            if curl -fsSL -X POST \
              -H "Authorization: Bearer ${PAT}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/NoMercy-Entertainment/nomercy-packages/dispatches" \
              -d '{"event_type":"release_published","client_payload":{"version":"${{ inputs.version }}"}}'; then
              echo "Triggered nomercy-packages update"
              SUCCESS=true
              break
            else
              echo "Dispatch attempt $i/3 failed"
              sleep $((i * 5))
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "::error::Failed to trigger nomercy-packages update after 3 attempts"
            exit 1
          fi

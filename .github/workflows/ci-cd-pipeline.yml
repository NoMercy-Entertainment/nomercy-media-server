name: CI/CD Pipeline

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docker/**'
      - '.github/**'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - 'global.json'
      - '**/*.sln'
    branches:
      - dev
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docker/**'
      - '.github/**'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - 'global.json'
      - '**/*.sln'
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write
  actions: read

jobs:
  # Step 1: Run Tests
  test:
    if: ${{ !contains(github.event.head_commit.message, '[test-only]') }}
    uses: ./.github/workflows/test.yml
    with:
      dotnet-version: "10.0.x"

  # Step 2: Calculate next version (no commits or pushes)
  version_management:
    needs: test
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    uses: ./.github/workflows/version-and-release-management.yml
    secrets: inherit

  # Step 3: Build Executables from dev with version override
  build_executables:
    needs: version_management
    if: needs.version_management.outputs.should_deploy == 'true'
    uses: ./.github/workflows/build-executables.yml
    secrets: inherit
    with:
      dotnet-version: "10.0.x"
      version: ${{ needs.version_management.outputs.version }}

  # Step 4: Build Linux Packages (before release so packages are included)
  build_packages:
    needs: [version_management, build_executables]
    if: needs.version_management.outputs.should_deploy == 'true'
    uses: ./.github/workflows/build-packages.yml
    secrets: inherit
    with:
      version: ${{ needs.version_management.outputs.version }}
      commit-sha: ${{ github.sha != '' && github.sha || 'unknown' }}

  # Step 5: Build and push Docker images to ghcr.io (reuses linux binary from build_executables)
  build_docker_images:
    needs: [version_management, build_executables]
    if: needs.version_management.outputs.should_deploy == 'true'
    uses: ./.github/workflows/build-docker-images.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.version_management.outputs.version }}
      ref: ${{ github.sha }}

  # Step 6: Create the NIGHTLY release and sync dev's tree onto master.
  # Only runs after ALL builds succeed — version bump is atomic with release.
  #
  # Published as a prerelease on purpose. Every updater (the server's
  # UpdateChecker, the launcher, nomercy.tv's download page, the README link)
  # resolves GitHub's /releases/latest, which never returns a prerelease. So a
  # nightly reaches nobody until promote-release.yml promotes that exact build
  # to beta and then stable. The apt/rpm repository is updated on stable
  # promotion only, for the same reason.
  create_release:
    needs: [version_management, build_executables, build_packages, build_docker_images]
    if: needs.version_management.outputs.should_deploy == 'true'
    uses: ./.github/workflows/create-release.yml
    secrets: inherit
    with:
      version: ${{ needs.version_management.outputs.version }}
      prerelease: true
      release-name: "NoMercy MediaServer v${{ needs.version_management.outputs.version }} (nightly)"
      update-package-repository: false

  # Step 6b: Publish the plugin contract packages to nuget.org.
  #
  # Defined here rather than inside create-release.yml because nuget.org
  # matches a trusted publishing policy against the workflow file the JOB is
  # defined in, not the one the run entered through. Published from the
  # reusable workflow it is refused with "Workflow mismatch ... expected
  # 'ci-cd-pipeline.yml', actual 'create-release.yml'" no matter what the
  # policy names.
  #
  # Trusted publishing rather than a stored key: nuget.org exchanges this run's
  # OIDC token for a key that lives minutes, so there is no long-lived secret
  # to leak or rotate.
  publish_plugin_packages:
    needs: [version_management, create_release]
    if: needs.version_management.outputs.should_deploy == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","beast-unit"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Third-party plugin authors restore these from nuget.org — there is no
      # other distribution path. All four are packed together because a version
      # mismatch across them fails restore with NU1102 naming only the one a
      # caller forgot.
      - name: Pack the plugin contract
        run: |
          for project in \
            src/NoMercy.PluginSdk.Abstractions \
            src/NoMercy.PluginSdk.Mvc \
            src/NoMercy.PluginSdk.Testing \
            src/NoMercy.PluginSdk.Analyzers; do
            dotnet pack "$project" --configuration Release --output ./output
          done

      - name: Exchange this run's identity for a short-lived NuGet key
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet.org
        run: |
          # Loud rather than skipped. The step this replaced warned and exited
          # zero when it had no key, so four packages silently never published
          # and every plugin author stayed on the local feed with a green
          # release.
          if [ -z "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" ]; then
            echo "::error::Trusted publishing returned no key. Set the NUGET_USER repository variable to the nuget.org account that created the policy, and confirm the policy names this repository and ci-cd-pipeline.yml."
            exit 1
          fi
          dotnet nuget push "./output/*.nupkg" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  # Step 7: Tag the Docker images for the nightly channel.
  # Runs ONLY after create_release succeeds so nobody can pull a version until
  # its GitHub Release (with all file assets) is fully published. Re-tags the
  # already-pushed RC digest without rebuilding — the image bytes are identical.
  #
  # RC tags pushed by build_docker_images:
  #   <version>-rc, <version>-rc-nvidia, <version>-rc-intel, <version>-rc-amd
  #
  # Tags published here:
  #   <version>, nightly                  (cpu / default variant)
  #   <version>-nvidia, nightly-nvidia    (nvidia variant)
  #   <version>-intel, nightly-intel      (intel variant)
  #   <version>-amd, nightly-amd          (amd variant)
  #
  # The moving stable tags (latest, stable, nvidia, latest-nvidia, ...) and the
  # beta tags move only in promote-release.yml, from the immutable <version>
  # tags pushed here.
  promote_docker_images:
    needs: [version_management, build_docker_images, create_release]
    if: needs.version_management.outputs.should_deploy == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","beast-unit"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: nomercy-entertainment/nomercymediaserver

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Tag every variant for the nightly channel
        run: |
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          VERSION="${{ needs.version_management.outputs.version }}"
          docker buildx imagetools create \
            --tag "${BASE}:${VERSION}" \
            --tag "${BASE}:nightly" \
            "${BASE}:${VERSION}-rc"
          for variant in nvidia intel amd; do
            docker buildx imagetools create \
              --tag "${BASE}:${VERSION}-${variant}" \
              --tag "${BASE}:nightly-${variant}" \
              "${BASE}:${VERSION}-rc-${variant}"
          done

name: CI/CD Pipeline

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docker/**'
      - '.github/**'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - 'global.json'
      - '**/*.sln'
    branches:
      - dev
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docker/**'
      - '.github/**'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - 'global.json'
      - '**/*.sln'
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write
  actions: read

jobs:
  # Step 1: Run Tests
  test:
    if: ${{ !contains(github.event.head_commit.message, '[test-only]') }}
    uses: ./.github/workflows/test.yml
    with:
      dotnet-version: "10.0.x"

  # Step 2: Calculate next version (no commits or pushes)
  version_management:
    needs: test
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    uses: ./.github/workflows/version-and-release-management.yml
    secrets: inherit

  # Step 3: Build Executables from dev with version override
  build_executables:
    needs: version_management
    if: needs.version_management.outputs.should_deploy == 'true'
    uses: ./.github/workflows/build-executables.yml
    secrets: inherit
    with:
      dotnet-version: "10.0.x"
      version: ${{ needs.version_management.outputs.version }}

  # Step 4: Build Linux Packages (before release so packages are included)
  build_packages:
    needs: [version_management, build_executables]
    if: needs.version_management.outputs.should_deploy == 'true'
    uses: ./.github/workflows/build-packages.yml
    secrets: inherit
    with:
      version: ${{ needs.version_management.outputs.version }}
      commit-sha: ${{ github.sha != '' && github.sha || 'unknown' }}

  # Step 5: Build and push Docker images to ghcr.io (reuses linux binary from build_executables)
  build_docker_images:
    needs: [version_management, build_executables]
    if: needs.version_management.outputs.should_deploy == 'true'
    uses: ./.github/workflows/build-docker-images.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.version_management.outputs.version }}
      ref: ${{ github.sha }}

  # Step 6: Create Release and sync dev's tree onto master
  # Only runs after ALL builds succeed — version bump is atomic with release
  create_release:
    needs: [version_management, build_executables, build_packages, build_docker_images]
    if: needs.version_management.outputs.should_deploy == 'true'
    uses: ./.github/workflows/create-release.yml
    secrets: inherit
    with:
      version: ${{ needs.version_management.outputs.version }}

  # Step 6b: Publish the plugin contract packages to nuget.org.
  #
  # Defined here rather than inside create-release.yml because nuget.org
  # matches a trusted publishing policy against the workflow file the JOB is
  # defined in, not the one the run entered through. Published from the
  # reusable workflow it is refused with "Workflow mismatch ... expected
  # 'ci-cd-pipeline.yml', actual 'create-release.yml'" no matter what the
  # policy names.
  #
  # Trusted publishing rather than a stored key: nuget.org exchanges this run's
  # OIDC token for a key that lives minutes, so there is no long-lived secret
  # to leak or rotate.
  publish_plugin_packages:
    needs: [version_management, create_release]
    if: needs.version_management.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Third-party plugin authors restore these from nuget.org — there is no
      # other distribution path. All six are packed together because a version
      # mismatch across them fails restore with NU1102 naming only the one a
      # caller forgot.
      - name: Pack the plugin contract
        run: |
          for project in \
            src/NoMercy.Events \
            src/NoMercy.Design \
            src/NoMercy.Plugins.Abstractions \
            src/NoMercy.Plugins.Mvc \
            src/NoMercy.Plugins.Testing \
            src/NoMercy.Plugins.Analyzers; do
            dotnet pack "$project" --configuration Release --output ./output
          done

      - name: Exchange this run's identity for a short-lived NuGet key
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet.org
        run: |
          # Loud rather than skipped. The step this replaced warned and exited
          # zero when it had no key, so six packages silently never published
          # and every plugin author stayed on the local feed with a green
          # release.
          if [ -z "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" ]; then
            echo "::error::Trusted publishing returned no key. Set the NUGET_USER repository variable to the nuget.org account that created the policy, and confirm the policy names this repository and ci-cd-pipeline.yml."
            exit 1
          fi
          dotnet nuget push "./output/*.nupkg" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  # Step 7: Promote Docker images from RC tags to stable floating tags.
  # Runs ONLY after create_release succeeds so users cannot pull :latest or
  # :<version> until the GitHub Release (with all file assets) is fully published.
  # Uses `docker buildx imagetools create` to re-tag the already-pushed RC digest
  # without rebuilding — the image bytes are identical.
  #
  # RC tags pushed by build_docker_images:
  #   <version>-rc, <version>-rc-nvidia, <version>-rc-intel, <version>-rc-amd
  #
  # Stable tags published here (superset of the pre-gating tag set, so no
  # existing pull reference disappears):
  #   <version>, latest                        (cpu / default variant)
  #   <version>-nvidia, nvidia, latest-nvidia  (nvidia variant)
  #   <version>-intel, intel, latest-intel     (intel variant)
  #   <version>-amd, amd, latest-amd           (amd variant)
  promote_docker_images:
    needs: [version_management, build_docker_images, create_release]
    if: needs.version_management.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: nomercy-entertainment/nomercymediaserver

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Promote cpu variant
        run: |
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          VERSION="${{ needs.version_management.outputs.version }}"
          docker buildx imagetools create \
            --tag "${BASE}:${VERSION}" \
            --tag "${BASE}:latest" \
            "${BASE}:${VERSION}-rc"

      - name: Promote nvidia variant
        run: |
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          VERSION="${{ needs.version_management.outputs.version }}"
          docker buildx imagetools create \
            --tag "${BASE}:${VERSION}-nvidia" \
            --tag "${BASE}:nvidia" \
            --tag "${BASE}:latest-nvidia" \
            "${BASE}:${VERSION}-rc-nvidia"

      - name: Promote intel variant
        run: |
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          VERSION="${{ needs.version_management.outputs.version }}"
          docker buildx imagetools create \
            --tag "${BASE}:${VERSION}-intel" \
            --tag "${BASE}:intel" \
            --tag "${BASE}:latest-intel" \
            "${BASE}:${VERSION}-rc-intel"

      - name: Promote amd variant
        run: |
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          VERSION="${{ needs.version_management.outputs.version }}"
          docker buildx imagetools create \
            --tag "${BASE}:${VERSION}-amd" \
            --tag "${BASE}:amd" \
            --tag "${BASE}:latest-amd" \
            "${BASE}:${VERSION}-rc-amd"

name: 'Package Building Workflow'

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
      version:
        description: 'Package version'
        required: true
        type: string
      commit-sha:
        description: '7-char commit SHA to embed in installers'
        required: false
        type: string
        default: 'unknown'
    secrets:
      GPG_PRIVATE_KEY:
        description: 'GPG private key for signing'
        required: true
      PAT:
        description: 'PAT for accessing the private NoMercyApp repo'
        required: true

jobs:
  build_packages:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        package-type: [deb, rpm, arch]
        os: [ubuntu-latest]
        include:
          # No self-hosted Windows box builds installers, so this leg stays on
          # a GitHub-hosted runner.
          - package-type: windows-installer
            os: windows-latest
          - package-type: macos-installer
            os: [self-hosted, macOS, ARM64, mac-mini]
      fail-fast: false

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Override version in Directory.Build.props
        if: inputs.version != ''
        shell: bash
        run: |
          perl -i -pe 's|<Version>.*?</Version>|<Version>${{ inputs.version }}</Version>|' Directory.Build.props
          echo "Injected version ${{ inputs.version }} into Directory.Build.props"
          grep '<Version>' Directory.Build.props

      - name: Build DEB packages
        if: matrix.package-type == 'deb'
        uses: ./.github/actions/build-deb-packages
        with:
          version: ${{ inputs.version }}
          app-repo-token: ${{ secrets.PAT }}

      - name: Build RPM packages
        if: matrix.package-type == 'rpm'
        uses: ./.github/actions/build-rpm-packages
        with:
          version: ${{ inputs.version }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          app-repo-token: ${{ secrets.PAT }}

      - name: Build Arch packages
        if: matrix.package-type == 'arch'
        uses: ./.github/actions/build-arch-packages
        with:
          version: ${{ inputs.version }}
          app-repo-token: ${{ secrets.PAT }}

      - name: Build Windows installer
        if: matrix.package-type == 'windows-installer'
        uses: ./.github/actions/build-windows-installer
        with:
          version: ${{ inputs.version }}
          commit-sha: ${{ inputs.commit-sha }}
          app-repo-token: ${{ secrets.PAT }}

      - name: Build macOS installer
        if: matrix.package-type == 'macos-installer'
        uses: ./.github/actions/build-macos-installer
        with:
          version: ${{ inputs.version }}
          app-repo-token: ${{ secrets.PAT }}

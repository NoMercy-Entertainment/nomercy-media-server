name: 'Test Workflow'

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: '.NET version to use'
        required: false
        type: string
        default: '10.0.x'

jobs:
  # Fast tests that run on every push/PR
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup .NET Environment
        uses: ./.github/actions/setup-dotnet
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Run fast tests (Unit + ErrorHandling + Characterization)
        run: >
          dotnet test NoMercy.Server.sln
          --configuration Debug
          --no-restore
          --verbosity minimal
          --logger trx
          --blame-hang-timeout 5m
          --filter "(Category=Unit|Category=ErrorHandling|Category=Characterization)&Category!=Integration"

  # Full-suite coverage job — runs on EVERY invocation of this reusable workflow
  # (every push/PR to dev, plus master and manual dispatch). It is the only job
  # that runs uncategorized tests: whole projects like Authorization and Storage,
  # and the plugin suite, carry no Category trait and are excluded from the fast
  # `test` filter. It previously gated on refs/heads/master, so on the real
  # release path (push/PR to dev) it never ran and uncategorized regressions
  # sailed straight through. It must block the release path.
  coverage:
    runs-on: ubuntu-latest
    # Nothing downstream reads a coverage artifact, so this job is a test gate, not
    # a report. Without a cap it once ran 6 hours before GitHub killed it, holding
    # the whole release chain open the entire time.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup .NET Environment
        uses: ./.github/actions/setup-dotnet
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # The coverage job runs the full suite, including the uncategorized and
      # Integration encoder tests that shell out to ffmpeg/ffprobe. Without the
      # binary they fail with "No such file or directory" — same fetch the
      # integration_tests job uses.
      - name: Fetch nomercy-ffmpeg fork (real-encode tests)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dest="$HOME/.local/share/NoMercy_dev/binaries/ffmpeg"
          mkdir -p "$dest"

          # A degraded GitHub API yields an empty tag rather than an error, and
          # `gh release download ""` then fails with a bare "release not found"
          # that reads like the release was deleted. Retry, and never carry an
          # empty tag forward.
          tag=""
          for attempt in 1 2 3 4 5; do
            if tag="$(gh release list --repo NoMercy-Entertainment/nomercy-ffmpeg --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')" && [ -n "$tag" ]; then
              break
            fi
            tag=""
            echo "Attempt $attempt: could not resolve the latest nomercy-ffmpeg tag; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done

          if [ -z "$tag" ]; then
            echo "::error::Could not resolve the latest nomercy-ffmpeg release tag after 5 attempts (GitHub API degraded?)."
            exit 1
          fi

          # Start from an empty staging dir. Two matches on the glob below turns
          # `tar -xzf a.tar.gz b.tar.gz` into "extract member b.tar.gz from
          # archive a.tar.gz", which fails.
          rm -rf /tmp/nmff
          mkdir -p /tmp/nmff

          downloaded=""
          for attempt in 1 2 3 4 5; do
            if gh release download "$tag" --repo NoMercy-Entertainment/nomercy-ffmpeg --pattern 'ffmpeg-*-linux-x86_64-*.tar.gz' --dir /tmp/nmff --clobber; then
              downloaded=1
              break
            fi
            echo "Attempt $attempt: downloading nomercy-ffmpeg $tag failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done

          if [ -z "$downloaded" ]; then
            echo "::error::Could not download nomercy-ffmpeg $tag after 5 attempts."
            exit 1
          fi

          tar -xzf /tmp/nmff/ffmpeg-*-linux-x86_64-*.tar.gz -C "$dest"
          chmod +x "$dest/ffmpeg" "$dest/ffprobe"
          echo "NOMERCY_FFMPEG_PATH=$dest/ffmpeg" >> "$GITHUB_ENV"
          echo "Fetched nomercy-ffmpeg $tag -> $dest"

      # Only the uncategorized tests: everything with a Category trait already ran
      # in `test` (Unit/ErrorHandling/Characterization) or `integration_tests`
      # (Integration), and re-running all ~4600 of them plus the real encodes is
      # what made this job take 70-90 minutes and gate every release behind itself.
      # A missing trait satisfies every `!=` clause, so this selects exactly the
      # gap the job exists to close. Performance is excluded too: those tests
      # time live TMDB calls against a wall-clock budget and have their own job,
      # and a slow TMDB day failed this gate twice in a row on 2026-09-15.
      - name: Run uncategorized tests
        run: >
          dotnet test NoMercy.Server.sln
          --configuration Release
          --verbosity minimal
          --blame-hang-timeout 10m
          --filter "Category!=Unit&Category!=ErrorHandling&Category!=Characterization&Category!=Integration&Category!=Performance"

  # Integration tests - run on the dev release path (direct pushes to dev), master,
  # releases, or manually. PRs (github.ref = refs/pull/N/merge) don't match the
  # branch refs, so these expensive ffmpeg-backed tests run post-merge on dev, not
  # on every PR — but they no longer skip the release path entirely.
  integration_tests:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup .NET Environment
        uses: ./.github/actions/setup-dotnet
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Fetch nomercy-ffmpeg fork (real-encode integration tests)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dest="$HOME/.local/share/NoMercy_dev/binaries/ffmpeg"
          mkdir -p "$dest"

          # A degraded GitHub API yields an empty tag rather than an error, and
          # `gh release download ""` then fails with a bare "release not found"
          # that reads like the release was deleted. Retry, and never carry an
          # empty tag forward.
          tag=""
          for attempt in 1 2 3 4 5; do
            if tag="$(gh release list --repo NoMercy-Entertainment/nomercy-ffmpeg --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')" && [ -n "$tag" ]; then
              break
            fi
            tag=""
            echo "Attempt $attempt: could not resolve the latest nomercy-ffmpeg tag; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done

          if [ -z "$tag" ]; then
            echo "::error::Could not resolve the latest nomercy-ffmpeg release tag after 5 attempts (GitHub API degraded?)."
            exit 1
          fi

          # Start from an empty staging dir. Two matches on the glob below turns
          # `tar -xzf a.tar.gz b.tar.gz` into "extract member b.tar.gz from
          # archive a.tar.gz", which fails.
          rm -rf /tmp/nmff
          mkdir -p /tmp/nmff

          downloaded=""
          for attempt in 1 2 3 4 5; do
            if gh release download "$tag" --repo NoMercy-Entertainment/nomercy-ffmpeg --pattern 'ffmpeg-*-linux-x86_64-*.tar.gz' --dir /tmp/nmff --clobber; then
              downloaded=1
              break
            fi
            echo "Attempt $attempt: downloading nomercy-ffmpeg $tag failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done

          if [ -z "$downloaded" ]; then
            echo "::error::Could not download nomercy-ffmpeg $tag after 5 attempts."
            exit 1
          fi

          tar -xzf /tmp/nmff/ffmpeg-*-linux-x86_64-*.tar.gz -C "$dest"
          chmod +x "$dest/ffmpeg" "$dest/ffprobe"
          echo "NOMERCY_FFMPEG_PATH=$dest/ffmpeg" >> "$GITHUB_ENV"
          echo "Fetched nomercy-ffmpeg $tag -> $dest"

      # TMDB's own availability is excluded from the gate. These call the live API, so a bad
      # minute at TMDB used to fail this job, which fails `test`, which blocks
      # version_management, create_release and promote_docker_images — no user on any platform
      # gets an update because a third party returned null. They still run, immediately below,
      # where a failure is visible without holding a release hostage.
      - name: Run integration tests
        run: >
          dotnet test NoMercy.Server.sln
          --configuration Debug
          --no-restore
          --verbosity minimal
          --logger trx
          --blame-hang-timeout 10m
          --filter "Category=Integration&FullyQualifiedName!~NoMercy.Tests.Providers.TMDB"

      - name: Run live TMDB API tests (reported, never blocking)
        continue-on-error: true
        run: >
          dotnet test NoMercy.Server.sln
          --configuration Debug
          --no-restore
          --verbosity minimal
          --logger trx
          --blame-hang-timeout 10m
          --filter "Category=Integration&FullyQualifiedName~NoMercy.Tests.Providers.TMDB"

      # A full build of this solution is ~9.5GB of output — ~7GB of it is tests/,
      # because each of the 20 test projects copies the whole native dependency
      # closure (SkiaSharp, Magick.NET) for EVERY runtime identifier: ~360MB of
      # runtimes/ per project, of which the runner executes exactly one platform.
      # Keeping the Debug tree while Release builds needs ~19GB on a ~14GB runner,
      # which is what exhausted the disk: every step passed and then the runner
      # died writing its own _diag log, surfacing as a failure with no failing
      # step and no test output. The two configurations are never needed at once.
      - name: Drop the Debug output before building Release
        run: |
          echo "before:"
          df -h / | tail -1
          find . -type d \( -path '*/bin/Debug' -o -path '*/obj/Debug' \) -prune -exec rm -rf {} + || true
          echo "after:"
          df -h / | tail -1

      - name: Run performance tests
        run: >
          dotnet test NoMercy.Server.sln
          --configuration Release
          --no-restore
          --verbosity minimal
          --logger trx
          --blame-hang-timeout 15m
          --filter "Category=Performance"

name: 'Test Only (churn)'

# Full test suite WITHOUT the release/version-bump pipeline, for commits whose
# message contains [test-only]. Unlike the fast `test` job in the main pipeline
# (Unit|ErrorHandling|Characterization only), this runs the ENTIRE solution test
# suite — including uncategorized tests (e.g. plugins) and the ffmpeg-backed
# integration/encoder tests — so refactor churn gets a true stability picture on
# dev without triggering create_release (version bump + force-push).
on:
  push:
    branches:
      - dev
      - 'refactor/**'

concurrency:
  group: test-only-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-test:
    if: ${{ contains(github.event.head_commit.message, '[test-only]') }}
    runs-on: [self-hosted, Linux, X64, beast-unit]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup .NET Environment
        uses: ./.github/actions/setup-dotnet
        with:
          dotnet-version: '10.0.x'

      - name: Fetch nomercy-ffmpeg fork (real-encode integration tests)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dest="$HOME/.local/share/NoMercy_dev/binaries/ffmpeg"
          mkdir -p "$dest"

          # A degraded GitHub API yields an empty tag rather than an error, and
          # `gh release download ""` then fails with a bare "release not found"
          # that reads like the release was deleted. Retry, and never carry an
          # empty tag forward.
          tag=""
          for attempt in 1 2 3 4 5; do
            if tag="$(gh release list --repo NoMercy-Entertainment/nomercy-ffmpeg --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')" && [ -n "$tag" ]; then
              break
            fi
            tag=""
            echo "Attempt $attempt: could not resolve the latest nomercy-ffmpeg tag; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done

          if [ -z "$tag" ]; then
            echo "::error::Could not resolve the latest nomercy-ffmpeg release tag after 5 attempts (GitHub API degraded?)."
            exit 1
          fi

          # The runner is self-hosted and its /tmp survives between jobs, so a
          # tarball from a previous version can still be sitting here. Two
          # matches on the glob below turns `tar -xzf a.tar.gz b.tar.gz` into
          # "extract member b.tar.gz from archive a.tar.gz", which fails.
          rm -rf /tmp/nmff
          mkdir -p /tmp/nmff

          downloaded=""
          for attempt in 1 2 3 4 5; do
            if gh release download "$tag" --repo NoMercy-Entertainment/nomercy-ffmpeg --pattern 'ffmpeg-*-linux-x86_64-*.tar.gz' --dir /tmp/nmff --clobber; then
              downloaded=1
              break
            fi
            echo "Attempt $attempt: downloading nomercy-ffmpeg $tag failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done

          if [ -z "$downloaded" ]; then
            echo "::error::Could not download nomercy-ffmpeg $tag after 5 attempts."
            exit 1
          fi

          tar -xzf /tmp/nmff/ffmpeg-*-linux-x86_64-*.tar.gz -C "$dest"
          chmod +x "$dest/ffmpeg" "$dest/ffprobe"
          echo "NOMERCY_FFMPEG_PATH=$dest/ffmpeg" >> "$GITHUB_ENV"

      - name: Run FULL test suite (all categories, all projects)
        id: fulltest
        run: |
          set +e
          dotnet test NoMercy.Server.sln \
            --settings tests/default.runsettings \
            --configuration Debug \
            --verbosity minimal \
            --logger "trx" \
            --results-directory ./testresults \
            --blame-hang-timeout 10m
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Surface failed tests as annotations
        if: always()
        run: |
          shopt -s globstar nullglob
          found=0
          for f in ./testresults/**/*.trx ./testresults/*.trx; do
            [ -f "$f" ] || continue
            grep -oE 'testName="[^"]+"[^>]*outcome="Failed"' "$f" \
              | sed -E 's/.*testName="([^"]+)".*/\1/' | sort -u | while read -r t; do
                echo "::error title=Test failed::$t"
              done
            grep -qE 'outcome="Failed"' "$f" && found=1
          done
          {
            echo "## Failed tests"
            for f in ./testresults/**/*.trx ./testresults/*.trx; do
              [ -f "$f" ] || continue
              grep -oE 'testName="[^"]+"[^>]*outcome="Failed"' "$f" \
                | sed -E 's/.*testName="([^"]+)".*/- `\1`/' | sort -u
            done
            echo
            echo "(found=$found)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Annotated failed tests (found=$found)"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churn-test-results
          path: ./testresults

      - name: Fail job if any test failed
        if: steps.fulltest.outputs.exit_code != '0'
        run: |
          echo "Test suite exit code: ${{ steps.fulltest.outputs.exit_code }}"
          exit 1

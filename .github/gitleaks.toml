title = "NoMercy secret scan"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Published RFC 8291 Web Push test vectors"
condition = "AND"
regexTarget = "secret"
paths = ['''tests/NoMercy\.Tests\.Notifications/Push/rfc8291-example\.json$''']
regexes = [
  '''^q1dXpw3UpT5VOmu_cf_v6ih07Aems3njxI-JWgLcM94$''',
  '''^BTBZMqHH6r4Tts7J_aSIgg$''',
  '''^yfWPiYE-n46HLnH0KqZOF1fJJU3MYrct3AELtAQ-oRw$''',
]

# Triaged false positives: each entry pins one exact path and one exact line shape.
[[rules.allowlists]]
description = "Doc comment with a hyphenated word, not a secret"
condition = "AND"
regexTarget = "line"
paths = ['''src/NoMercy\.NmSystem/Logging/Rendering/ConsoleLineRenderer\.cs$''']
regexes = ['''values token-colo\w+, continuation''']

[[rules.allowlists]]
description = "Made-up encoder option value in a test"
condition = "AND"
regexTarget = "line"
paths = ['''tests/NoMercy\.Tests\.Api/WorkersController_RegisterHttpsTests\.cs$''']
regexes = ['''= "0123456789abcdef" \};$''']

[[rules.allowlists]]
description = "Made-up broker test token"
condition = "AND"
regexTarget = "line"
paths = [
  '''tests/NoMercy\.Tests\.PluginHost/BrokerChannelTests\.cs$''',
  '''tests/NoMercy\.Tests\.Plugins/PluginRemoteLoaderTests\.cs$''',
]
regexes = ['''Token(?: =>)?(?: =)? "3F2A9C01B7E84D6A";$''']

[[rules]]
id = "jwt"

# The TMDB read token is public by design: the NoMercy API hands it to every server.
[[rules.allowlists]]
description = "TMDB read token, public by design"
paths = ['''tests/NoMercy\.Tests\.Providers/TMDB/TmdbTestBase\.cs$''']

name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    # The release step creates a release and uploads to it. A repository or
    # organisation whose default token is read-only otherwise refuses it, and
    # the tag build ends red with nothing published.
    permissions:
      contents: write
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release

      # The analyzer already ran during the build: it is a package reference,
      # so NMP0001 to NMP0016 are compile errors here rather than a refusal on
      # someone's server. This reads the manifest, which the compiler cannot.
      - run: dotnet tool install --global nomercy-plugin
      - run: nomercy-plugin verify .

      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          dotnet publish --configuration Release --output publish
          cd publish && zip -r ../plugin.zip .

      # The repository file lives at one path for the life of the plugin. A
      # server's repository list points at a URL, so a path that moves per
      # release is a list that stops updating and says nothing.
      - name: Write repository.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import json, os, hashlib
          version = os.environ['GITHUB_REF_NAME'].lstrip('v')
          # The host that serves the release: github.com on GitHub, the
          # instance's own address on Forgejo, which sets the same variable.
          server = os.environ.get('GITHUB_SERVER_URL', 'https://github.com').rstrip('/')
          digest = hashlib.sha256(open('plugin.zip', 'rb').read()).hexdigest()
          repository = json.load(open('repository.json'))
          repository['plugins'][0]['versions'].insert(0, {
              'version': version,
              'url': f"{server}/{os.environ['GITHUB_REPOSITORY']}/releases/download/v{version}/plugin.zip",
              'sha256': digest,
          })
          json.dump(repository, open('repository.json', 'w'), indent=2)
          PY

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            plugin.zip
            repository.json
